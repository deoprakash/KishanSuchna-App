# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Python app to Azure Web App - kishansuchna-backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # required for checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Show Backend files (debug)
        run: |
          echo "Listing Backend folder contents"
          ls -la Backend || true

      # Upload ONLY the Backend folder
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: Backend/        # <– EXACT folder name with capital B

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E73DB7F71EF74EECAFBA8EE360DFF0A0 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_208C5D60DAB14A9EBFE3D743D06B8511 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_50E472DE1A9842FD9F087554CE26B054 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'kishansuchna-backend'
          slot-name: 'Production'
          # After download-artifact the artifact is extracted to ./python-app
          # When we uploaded the Backend folder, its contents appear under
          # ./python-app/Backend. Use that path as the package to deploy.
          package: './python-app/Backend'

      - name: List deployed package files (debug)
        run: |
          echo "Contents of working dir"
          ls -la
          echo "Contents of python-app"
          ls -la python-app || true
