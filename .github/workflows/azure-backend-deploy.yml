name: Deploy Backend to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Debug – list backend folder
        run: |
          echo "Root:"
          ls -la
          echo "Backend:"
          ls -la Backend

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend
          path: Backend/    # ← EXACT folder name

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend

      - name: Debug – list downloaded artifact
        run: |
          echo "After download:"
          ls -la

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E73DB7F71EF74EECAFBA8EE360DFF0A0 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_208C5D60DAB14A9EBFE3D743D06B8511 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_50E472DE1A9842FD9F087554CE26B054 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "kishansuchna-backend"
          package: "."   # deploy CURRENT folder (contains Backend/)
